upstream django_server {
    server web:8000;
}

server {
    listen 80 default_server;
    server_name juventudonline.store www.juventudonline.store;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name juventudonline.store www.juventudonline.store;

    ssl_certificate /etc/letsencrypt/live/juventudonline.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juventudonline.store/privkey.pem;

    # Recommended SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 2M;  # M-5: forms don't need more; admin uploads are small

    location / {
        proxy_pass http://django_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}
