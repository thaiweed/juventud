# ─────────────────────────────────────────────────────────────────────────────
# Juventud — Nginx Production Config
#
# Логика:
#   HTTP  (80)  → 301 редирект на HTTPS
#   HTTPS (443) → проксирование на Gunicorn (web:8000)
#                 раздача /static/ и /media/ напрямую из файловой системы
# ─────────────────────────────────────────────────────────────────────────────

upstream django {
    server web:8000;
    keepalive 16;
}

# ── Глобальные настройки gzip ─────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# ── HTTP → HTTPS редирект ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name juventudonline.store www.juventudonline.store;

    # Certbot challenge (нужно при обновлении сертификатов)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное — перенаправляем на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name juventudonline.store www.juventudonline.store;

    # ── SSL-сертификаты Let's Encrypt ─────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/juventudonline.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juventudonline.store/privkey.pem;

    # ── SSL-параметры ─────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security Headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Лимиты ───────────────────────────────────────────────────────────
    client_max_body_size 20M;
    client_body_timeout  30s;
    client_header_timeout 30s;
    keepalive_timeout    65s;
    send_timeout         30s;

    # ── Статика (раздаётся Nginx напрямую, без Django) ────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Медиафайлы ───────────────────────────────────────────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Django / Gunicorn ─────────────────────────────────────────────────
    location / {
        proxy_pass http://django;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    60s;

        proxy_redirect off;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ── Скрываем служебные файлы ─────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        alias /app/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        alias /app/staticfiles/robots.txt;
        access_log off;
        log_not_found off;
    }
}
