{% load static %}
<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
    <title>{% block title %}Juventud — Clothing{% endblock %}</title>
    <meta name="description" content="Juventud — Clothing" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

    <!-- HTMX & Alpine.js -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Tailwind (CDN for now, can be replaced with build) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=7" />

    <style>
        /* Custom Tailwind config simulation if needed */
        .brand-img {
            max-height: 40px;
        }

        .hero {
            padding: 4rem 0;
            text-align: center;
        }

        .card {
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="font-inter antialiased text-gray-900 bg-white" hx-boost="true">

    <!-- Cart State (Global) -->
    <div x-data="{ cartOpen: false }" @open-cart.window="cartOpen = true">

        <header class="site-header border-b border-gray-200 py-10 sticky top-0 bg-white z-40">
            <div class="container mx-auto px-4 relative flex items-center justify-between">
                <!-- Left Spacer (for balance if needed, or just justify-between) -->
                <div class="w-10"></div> 

                <!-- Centered Logo -->
                <a href="{% url 'catalog:product_list' %}" class="absolute left-1/2 transform -translate-x-1/2"
                   hx-get="{% url 'catalog:product_list' %}"
                   hx-target="#main-content"
                   hx-swap="innerHTML"
                   hx-push-url="true">
                    <img src="{% static 'img/juventud_logo.png' %}" alt="JUVENTUD" class="h-24 md:h-32 object-contain">
                </a>

                <!-- Right Cart -->
                <nav class="flex gap-4">
                    <button @click="cartOpen = true"
                        class="uppercase text-sm tracking-wider font-medium hover:opacity-60 transition flex items-center">
                        Cart<span id="cart-count">{% if cart %}<span class="ml-1 text-xs">({{ cart|length }})</span>{% endif %}</span>
                    </button>
                </nav>
            </div>
        </header>

        <main id="main-content" class="min-h-screen py-8">
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer border-t border-gray-200 py-8 text-center text-sm text-gray-500">
            <div class="container mx-auto px-4 space-y-3">
                <div>
                    <span>© <span id="year">{% now "Y" %}</span> Juventud</span>
                </div>
                <div class="flex flex-wrap items-center justify-center gap-x-4 gap-y-1">
                    <a class="hover:text-black transition" href="mailto:juventudsupp@gmail.com">juventudsupp@gmail.com</a>
                    <span class="text-gray-300 hidden sm:inline">·</span>
                    <span>ИНН&nbsp;772098465303</span>
                </div>
                <div class="flex flex-wrap items-center justify-center gap-x-4 gap-y-1 text-xs">
                    <a href="{% url 'legal_offer' %}" class="hover:text-black transition underline underline-offset-2">Публичная оферта</a>
                    <span class="text-gray-300 hidden sm:inline">·</span>
                    <a href="{% url 'legal_privacy' %}" class="hover:text-black transition underline underline-offset-2">Политика конфиденциальности</a>
                </div>
            </div>
        </footer>

        <!-- Cart Modal -->
        {% include 'partials/cart_modal.html' %}

    </div>

    <script>
        // ── Scroll to top on every HTMX navigation ──────────────────────
        document.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target && evt.detail.target.id === 'main-content') {
                window.scrollTo({ top: 0, behavior: 'instant' });
            }
        });

        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });

        // ── Fix: prevent Alpine.js x-for duplication on browser back navigation ──
        // HTMX saves Alpine-rendered HTML in localStorage. On back navigation it
        // restores that snapshot and Alpine doubles all x-for elements.
        // Solution: intercept htmx:historyRestore for product pages, clear the
        // container immediately (before Alpine processes it), then fetch fresh HTML.
        document.addEventListener('htmx:historyRestore', function(evt) {
            var path = (evt.detail && evt.detail.path) || window.location.pathname;
            if (path && /\/product\//.test(path)) {
                var mainContent = document.getElementById('main-content');
                if (mainContent) {
                    mainContent.innerHTML = '';
                }
                htmx.ajax('GET', path, {
                    target: '#main-content',
                    swap: 'innerHTML'
                });
            }
        });

        // ── Alpine.js Gallery helper for color variants ──────────────────
        function productGallery(variants, defaultPrice) {
            return {
                variants,
                defaultPrice,
                selectedVariantIndex: variants.length > 0 ? 0 : null,
                selectedSizeId: '',
                activeIndex: 0,

                get selectedVariant() {
                    return this.selectedVariantIndex !== null ? this.variants[this.selectedVariantIndex] : null;
                },
                get activeImages() {
                    return this.selectedVariant ? this.selectedVariant.images : [];
                },
                get activeSizes() {
                    return this.selectedVariant ? this.selectedVariant.sizes : [];
                },
                get activePrice() {
                    return this.selectedVariant ? this.selectedVariant.price : this.defaultPrice;
                },

                selectVariant(index) {
                    this.selectedVariantIndex = index;
                    this.activeIndex = 0;
                    this.selectedSizeId = '';
                },

                init() {
                    // Auto-select first variant
                    if (this.variants.length > 0) {
                        this.selectVariant(0);
                    }
                }
            }
        }

        // ── Alpine.js Gallery helper for simple products (no variants) ────
        function productGallerySimple(images, sizes, defaultPrice) {
            return {
                activeImages: images,
                activeSizes: sizes,
                activePrice: defaultPrice,
                selectedSizeId: sizes.length === 0 ? 'default' : '',
                activeIndex: 0,
            }
        }
    </script>
</body>

</html>
