version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Juventud — Production Docker Compose
#
# Топология сети:
#   nginx (публичный) ──▶ web (внутренний) ──▶ db, redis (изолированные)
#                                    └──▶ celery
#
# Только nginx публикует порты 80/443 наружу.
# Все остальные контейнеры работают в закрытой сети juventud_net.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  juventud_net:
    driver: bridge
    internal: true    # запрещает исходящий интернет-трафик из сети
  nginx_net:
    driver: bridge    # публичная сеть для nginx ↔ web

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: juventud_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - juventud_net
    # expose делает порт видимым только внутри Docker-сети, не снаружи
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: juventud_redis
    restart: unless-stopped
    # Пароль из .env: REDIS_PASSWORD=...
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
    networks:
      - juventud_net
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django / Gunicorn ────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: juventud_web:latest
    container_name: juventud_web
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -"
    env_file: .env
    volumes:
      - static_volume:/app/staticfiles
      - ./media:/app/media
    networks:
      - juventud_net
      - nginx_net
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker ─────────────────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    image: juventud_web:latest
    container_name: juventud_celery
    restart: unless-stopped
    command: >
      celery -A config worker
        --loglevel=info
        --concurrency=2
        --max-tasks-per-child=1000
    env_file: .env
    volumes:
      - ./media:/app/media
    networks:
      - juventud_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat (опционально, для периодических задач) ────────────────────
  # celery-beat:
  #   image: juventud_web:latest
  #   container_name: juventud_beat
  #   restart: unless-stopped
  #   command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
  #   env_file: .env
  #   networks:
  #     - juventud_net
  #   depends_on:
  #     - db
  #     - redis

  # ── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: juventud_nginx
    restart: unless-stopped
    ports:
      - "80:80"    # только nginx открыт наружу
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - ./media:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - nginx_net
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
