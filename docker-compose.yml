version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: juventud_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: juventud_redis
    restart: always
    # L-3: require password — prevents unauthorized access if network isolation ever fails
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"

  web:
    build: .
    container_name: juventud_web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
      - ./media:/app/media
    expose:
      - "8000"
    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: juventud_celery
    restart: always
    command: celery -A config worker -l info
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.25-alpine
    container_name: juventud_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - ./media:/app/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
